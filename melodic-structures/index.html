<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melodic Structures – Übungstrainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#0E1420;
    --panel:#151E2C;
    --panel-2:#1B2637;
    --line:#273346;
    --paper:#F7F4EC;
    --brass:#E3A83E;
    --brass-dim:#8A6821;
    --teal:#57C7B0;
    --text:#E6EDF6;
    --muted:#8C9CB2;
    --display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
    --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  body{
    background:var(--ink);color:var(--text);font-family:var(--body);
    -webkit-font-smoothing:antialiased;line-height:1.5;
    padding:0 0 48px;
  }
  .wrap{max-width:980px;margin:0 auto;padding:0 20px}

  /* ---------- Kopf ---------- */
  header{padding:26px 0 10px}
  .brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
  h1{
    font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em;
    margin:0;text-transform:none;
  }
  h1 span{color:var(--muted);font-weight:500}
  .controls{display:flex;gap:8px;flex-wrap:wrap}
  select,.toggle button,.ghost{
    font-family:var(--body);font-size:13px;color:var(--text);
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:7px 10px;cursor:pointer;
  }
  select:focus-visible,button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .toggle{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .toggle button{border:0;border-radius:0;background:transparent;color:var(--muted)}
  .toggle button[aria-pressed="true"]{background:var(--panel-2);color:var(--brass);font-weight:600}

  /* ---------- Signatur: Fortschritts-Notenlinie ---------- */
  .spine{margin:18px 0 6px;position:relative}
  .spine svg{width:100%;height:auto;display:block;overflow:visible}
  .spine .lvl-hit{cursor:pointer}
  .spine-legend{
    display:flex;gap:14px;font-size:11.5px;color:var(--muted);
    font-family:var(--mono);letter-spacing:.02em;margin-top:2px;flex-wrap:wrap
  }
  .dotk{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}

  /* ---------- Karte ---------- */
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    margin-top:14px;overflow:hidden;
  }
  .card-head{
    padding:16px 20px 12px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap
  }
  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--brass);margin:0 0 4px
  }
  .card-head h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0;letter-spacing:-.015em}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{
    font-family:var(--mono);font-size:11.5px;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap
  }
  .chip.key{color:var(--brass);border-color:var(--brass-dim)}

  .instruction{padding:14px 20px 0;font-size:15px;max-width:62ch}
  .instruction b{color:#fff;font-weight:600}
  .instruction .sub{color:var(--muted);font-size:13.5px;margin-top:6px}
  .bookref{
    margin:12px 20px 0;padding-left:11px;border-left:2px solid var(--brass-dim);
    font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--muted)
  }

  /* ---------- Notenpapier ---------- */
  .paper{
    background:var(--paper);border-radius:10px;margin:16px 20px;padding:6px 4px;
    overflow-x:auto;
  }
  .paper svg{display:block;max-width:100%;height:auto}
  .paper.empty{
    display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:96px;
    color:#5a5348;font-size:13.5px;text-align:center;padding:20px
  }

  /* ---------- Zahlenansicht ---------- */
  .numbers{display:flex;gap:10px;flex-wrap:wrap;padding:4px 20px 0}
  .barbox{
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel-2);
    flex:1 1 auto;min-width:0;display:flex;gap:12px;align-items:flex-start
  }
  .barbox .beat{min-width:max-content}
  .barbox .beat + .beat{border-left:1px dashed var(--line);padding-left:12px}
  .barbox .cs{font-family:var(--display);font-weight:700;font-size:17px;margin-bottom:6px}
  /* Die vier Zahlen stehen immer in einer Zeile – lieber kleiner als umgebrochen */
  .barbox .tok{
    font-family:var(--mono);font-size:14px;color:var(--brass);
    white-space:nowrap;letter-spacing:.01em
  }

  /* ---------- Aktionen ---------- */
  .actions{display:flex;gap:10px;padding:18px 20px 20px;flex-wrap:wrap}
  .actions button{
    flex:1 1 200px;font-family:var(--display);font-weight:700;font-size:15px;
    border-radius:10px;padding:14px 16px;cursor:pointer;border:1px solid transparent;
    transition:transform .08s ease, background .15s ease;
  }
  .actions button:active{transform:translateY(1px)}
  #btn-again{background:var(--panel-2);border-color:var(--line);color:var(--text)}
  #btn-again:hover{background:#22304a}
  #btn-got{background:var(--teal);color:#06231d}
  #btn-got:hover{filter:brightness(1.06)}
  .actions small{display:block;font-family:var(--body);font-weight:400;font-size:12px;opacity:.72;margin-top:2px}

  /* ---------- Fuß ---------- */
  footer{display:flex;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap;align-items:center}
  .stats{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .ghost{background:transparent;color:var(--muted);font-size:12px}
  .ghost:hover{color:var(--text)}
  .footer-btns{display:flex;gap:14px;flex-wrap:wrap}
  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:22px;
    background:var(--brass);color:#20180a;font-family:var(--display);font-weight:700;
    padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;
    transition:opacity .25s ease, bottom .25s ease;z-index:20
  }
  .toast.show{opacity:1;bottom:30px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
  @media (max-width:620px){
    .card-head h2{font-size:19px}
    .paper{margin:14px 12px}
    .instruction,.numbers,.actions{padding-left:14px;padding-right:14px}
    .bookref{margin-left:14px;margin-right:14px}
    .card-head{padding:14px}
    .barbox{padding:9px 10px;gap:9px}
    .barbox .beat + .beat{padding-left:9px}
    .barbox .cs{font-size:15px}
    .barbox .tok{font-size:12px}
  }
  @media (max-width:400px){
    .barbox .tok{font-size:11px;letter-spacing:-.01em}
  }
</style>

<div class="wrap">
  <header>
    <div class="brandrow">
      <h1>Melodic Structures <span>· Übungstrainer</span></h1>
      <div class="controls">
        <select id="sel-inst" aria-label="Stimmung">
          <option value="C">C (Klavier, Flöte)</option>
          <option value="Bb">B♭ (Trompete, Tenor)</option>

        </select>
        <div class="toggle" role="group" aria-label="Ansicht">
          <button id="v-notes" aria-pressed="true">Noten</button>
          <button id="v-nums" aria-pressed="false">Zahlen</button>
        </div>
      </div>
    </div>

    <div class="spine">
      <svg id="spine" viewBox="0 0 760 92" role="img" aria-label="Fortschritt über alle Stufen"></svg>
      <div class="spine-legend">
        <span><i class="dotk" style="background:var(--teal)"></i>sitzt</span>
        <span><i class="dotk" style="background:var(--brass)"></i>in Arbeit</span>
        <span><i class="dotk" style="background:#2C384C"></i>offen</span>

      </div>
    </div>

  <main class="card">

      <div>

    <div class="instruction" id="instruction"></div>

    <div class="paper" id="paper"></div>
    <div class="numbers" id="numbers" hidden></div>

    <div class="actions">
      <button id="btn-again">Nochmal üben<small>kommt bald wieder</small></button>
      <button id="btn-got">Sitzt<small>aus dem Umlauf nehmen</small></button>

      <button class="ghost" id="btn-reset">Fortschritt zurücksetzen</button>
    </div>
  </footer>
</div>

<script>
/* =========================================================
   1 · TONHÖHEN-MODELL
   Note = {l: Buchstabe 0..6 (C..B), a: Vorzeichen -2..2, o: Oktave}
   ========================================================= */
const LETTERS = ['C','D','E','F','G','A','B'];
const LPC     = [0,2,4,5,7,9,11];
const MAJ     = [0,2,4,5,7,9,11];

const pc   = n => (LPC[n.l] + n.a + 120) % 12;
const midi = n => (n.o + 1) * 12 + LPC[n.l] + n.a;
const cp   = n => ({l:n.l, a:n.a, o:n.o});

function noteName(n){
  return LETTERS[n.l] + (n.a > 0 ? '♯'.repeat(n.a) : n.a < 0 ? '♭'.repeat(-n.a) : '');
}
function vexKey(n){
  const acc = n.a > 0 ? '#'.repeat(n.a) : n.a < 0 ? 'b'.repeat(-n.a) : '';
  return LETTERS[n.l].toLowerCase() + acc + '/' + n.o;
}
function parseRoot(s){
  const l = LETTERS.indexOf(s[0]);
  let a = 0;
  for (const c of s.slice(1)) a += (c === '#' ? 1 : -1);
  return {l, a, o:4};
}
/* Dur-Tonleiter mit korrekter Schreibweise */
function majorScale(root){
  const out = [];
  const rpc = LPC[root.l] + root.a;
  for (let i = 0; i < 7; i++){
    const l = (root.l + i) % 7;
    const bump = Math.floor((root.l + i) / 7);
    let diff = (rpc + MAJ[i]) - LPC[l];
    while (diff >  6) diff -= 12;
    while (diff < -6) diff += 12;
    out.push({l, a:diff, o:root.o + bump});
  }
  return out;
}
const ALTER = {                       // Abweichungen von der Dur-Tonleiter
  'maj7' : {},
  '7'    : {6:-1},
  'm7'   : {2:-1, 6:-1},
  'm7b5' : {1:-1, 2:-1, 4:-1, 5:-1, 6:-1},
  '7b9'  : {1:-1, 5:-1, 6:-1}
};
const REF_MINOR = new Set(['m7','m7b5']);   // Bezugsleiter für Vorzeichen im Zahlensystem

function chordScale(root, q){
  const s = majorScale(root).map(cp);
  const alt = ALTER[q] || {};
  for (const k in alt) s[k].a += alt[k];
  return s;
}
function refScale(root, q){
  const s = majorScale(root).map(cp);
  if (REF_MINOR.has(q)) { s[2].a -= 1; s[6].a -= 1; }   // dorisch
  return s;
}
/* Ein Zahlensymbol ("1", "b9", "#11", "13") → Note */
function resolveToken(tok, root, q){
  const m = /^([b#]*)(\d+)$/.exec(tok);
  const accs = m[1], num = parseInt(m[2], 10);
  const base = (num - 1) % 7, oct = Math.floor((num - 1) / 7);
  const scale = accs ? refScale(root, q) : chordScale(root, q);
  const n = cp(scale[base]);
  n.o += oct;
  for (const c of accs) n.a += (c === '#' ? 1 : -1);
  return n;
}
/* Die vier Töne einer Gruppe, immer aufsteigend gestapelt */
function groupPitches(tokens, root, q){
  const out = [];
  for (const t of tokens){
    const n = resolveToken(t, root, q);
    if (out.length){
      while (midi(n) <= midi(out[out.length - 1])) n.o++;
    }
    out.push(n);
  }
  return out;
}
/* Umkehrung k: die k tiefsten Töne eine Oktave nach oben.
   Die Zuordnung Index → Stufenzahl bleibt erhalten, damit die
   Permutation weiter auf dieselben Zahlen zeigt. */
function invert(set, k){
  const s = set.map(cp);
  for (let i = 0; i < k; i++) s[i].o++;
  return s;
}
/* Transposition für die notierte Stimme.
   dl = Verschiebung der Notenbuchstaben, ds = Halbtöne. Über dl lässt sich
   dasselbe Intervall anders schreiben: grosse Sekunde (C→D) oder
   verminderte Terz (C→E♭♭) – erst dadurch wird die Schreibweise wählbar. */
const TRANSPOSE = { C:[0,0], Bb:[1,2], Eb:[5,9], bass:[0,0] };
function transposeBy(n, dl, ds){
  const absTarget = midi(n) + ds;
  const l = ((n.l + dl) % 7 + 7) % 7;
  let o = n.o + Math.floor((n.l + dl) / 7);
  let a = absTarget - ((o + 1) * 12 + LPC[l]);
  while (a >  6) { o++; a = absTarget - ((o + 1) * 12 + LPC[l]); }
  while (a < -6) { o--; a = absTarget - ((o + 1) * 12 + LPC[l]); }
  return {l, a, o};
}
function transposeNote(n, inst){
  const [dl, ds] = TRANSPOSE[inst];
  return transposeBy(n, dl, ds);
}

/* =========================================================
   2 · AKKORDE & GRUPPEN
   ========================================================= */
const QSUFFIX = { 'maj7':'∆', '7':'7', 'm7':'-7', 'm7b5':'ø', '7b9':'7♭9' };
const chordSymbol = (root, q) => noteName(root) + QSUFFIX[q];
function parseChord(s){
  const m = /^([A-G][b#]?)(maj7|m7b5|m7|7b9|7)$/.exec(s.trim());
  if (!m) throw new Error('Akkord unlesbar: ' + s);
  return { root: parseRoot(m[1]), q: m[2] };
}

const GROUPINGS = {
  '1-5':  { label:'1-5',  name:'Grundgruppe',       tok:{ 'maj7':['1','2','3','5'],      '7':['1','2','3','5'],      'm7':['1','3','4','5'],     'm7b5':['1','3','4','b5'],       '7b9':['1','b2','3','5'] } },
  '5-9':  { label:'5-9',  name:'Mittellage',        tok:{ 'maj7':['5','6','7','9'],      '7':['5','6','7','9'],      'm7':['5','7','8','9'],     'm7b5':['5','7','8','b9'],       '7b9':['5','b6','7','b9'] } },
  '9-13': { label:'9-13', name:'Upper Structure',   tok:{ 'maj7':['9','10','#11','13'],  '7':['9','10','#11','13'],  'm7':['9','11','12','13'],  'm7b5':['b9','11','b12','b13'],  '7b9':['b9','10','#11','b13'] } },
  '3-7':  { label:'3-7',  name:'Guide Tones',       tok:{ 'maj7':['3','5','6','7'],      '7':['3','5','6','7'],      'm7':['3','4','5','7'],     'm7b5':['3','4','b5','7'],       '7b9':['3','5','b6','7'] } },
  '7-11': { label:'7-11', name:'Septime aufwärts',  tok:{ 'maj7':['7','9','10','#11'],   '7':['7','9','10','#11'],   'm7':['7','8','9','11'],    'm7b5':['7','8','b9','11'],      '7b9':['7','b9','10','#11'] } },
  '4-8':  { label:'4-8',  name:'Quarte aufwärts',   tok:{ 'maj7':['#4','6','7','8'],     '7':['#4','6','7','8'],     'm7':['4','5','6','8'],     'm7b5':['4','b5','b6','8'],      '7b9':['#4','b6','7','8'] } },
  '6-3':  { label:'6-3',  name:'Sexte aufwärts',    tok:{ 'maj7':['6','7','1','3'],      '7':['6','7','1','3'],      'm7':['6','1','2','3'],     'm7b5':['b6','1','b2','3'],      '7b9':['b6','7','1','3'] } }
};

/* alle 24 Permutationen als Index-Muster über [0,1,2,3] */
const PERMS = (() => {
  const out = [];
  const rec = (rest, acc) => {
    if (!rest.length) { out.push(acc); return; }
    rest.forEach((x,i) => rec(rest.filter((_,j) => j !== i), [...acc, x]));
  };
  rec([0,1,2,3], []);
  return out;
})();
const permKey = p => p.join('');
const PERM_CORE = ['0123','1032','2310','3210'];      // Grund + die drei vom Buch empfohlenen
const permByKey = k => PERMS[PERMS.findIndex(p => permKey(p) === k)];
function permLabel(permIdx, tokens){
  return permIdx.map(i => tokens[i]).join('-');
}

/* =========================================================
   3 · CHANGES (eigene Übungsprogressionen, klingende Notation)
   ========================================================= */
function P(id, name, spec){
  return { id, name, bars: spec.split('|').map(b => b.trim().split(/\s+/).map(parseChord)) };
}
/* Die zwölf Tonarten: [Anzeige, Tonika, II. Stufe, V. Stufe].
   Moll wird teils anders geschrieben als Dur (cis statt des, fis statt ges),
   sonst entstehen in den Akkordskalen Doppelvorzeichen. */
const DUR_KEYS = [
  ['C',  'C',  'D',  'G' ], ['D♭', 'Db', 'Eb', 'Ab'], ['D',  'D',  'E',  'A' ],
  ['E♭', 'Eb', 'F',  'Bb'], ['E',  'E',  'F#', 'B' ], ['F',  'F',  'G',  'C' ],
  ['G♭', 'Gb', 'Ab', 'Db'], ['G',  'G',  'A',  'D' ], ['A♭', 'Ab', 'Bb', 'Eb'],
  ['A',  'A',  'B',  'E' ], ['B♭', 'Bb', 'C',  'F' ], ['B',  'B',  'C#', 'F#']
];
const MOLL_KEYS = [
  ['c',  'C',  'D',  'G' ], ['c♯', 'C#', 'D#', 'G#'], ['d',  'D',  'E',  'A' ],
  ['e♭', 'Eb', 'F',  'Bb'], ['e',  'E',  'F#', 'B' ], ['f',  'F',  'G',  'C' ],
  ['f♯', 'F#', 'G#', 'C#'], ['g',  'G',  'A',  'D' ], ['a♭', 'Ab', 'Bb', 'Eb'],
  ['a',  'A',  'B',  'E' ], ['b♭', 'Bb', 'C',  'F' ], ['b',  'B',  'C#', 'F#']
];
const PROGS = {};
DUR_KEYS.forEach(([label, t, ii, v]) => {
  PROGS['t_' + t] = P('t_' + t, 'II-V-I in ' + label, `${ii}m7|${v}7|${t}maj7|${t}maj7`);
});
MOLL_KEYS.forEach(([label, t, ii, v]) => {
  PROGS['m_' + t] = P('m_' + t, 'II-V-i in ' + label, `${ii}m7b5|${v}7b9|${t}m7|${t}m7`);
});
const ALL_DUR  = DUR_KEYS.map(k => 't_' + k[1]);
const ALL_MOLL = MOLL_KEYS.map(k => 'm_' + k[1]);

/* Einzelakkorde: jeder Typ in allen zwölf Tonarten.
   Die Schreibweise regelt chooseSpelling – aus Ges-ø wird dort Fis-ø. */
const SINGLE_ROOTS = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const QUALITIES = ['maj7','7','m7','m7b5','7b9'];
const ALL_SINGLES = [];
QUALITIES.forEach(q => SINGLE_ROOTS.forEach(r => {
  const id = `s_${q}_${r}`;
  PROGS[id] = P(id, 'Einzelakkord', `${r}${q}`);
  PROGS[id].single = true;
  ALL_SINGLES.push(id);
}));

Object.assign(PROGS, {
  /* Turnarounds & dichte Changes */
  tn_C  : P('tn_C','Turnaround in C',       'Cmaj7 A7b9|Dm7 G7|Cmaj7 A7b9|Dm7 G7'),
  tn_F  : P('tn_F','Turnaround in F',       'Fmaj7 D7b9|Gm7 C7|Fmaj7 D7b9|Gm7 C7'),
  dense : P('dense','Zwei Akkorde pro Takt','Ebmaj7 Am7|D7 Gmaj7|Cm7 F7|Bbmaj7 Bbmaj7'),

  /* Blues in F, in Vierergruppen */
  bl1   : P('bl1','Blues in F · T. 1–4',    'F7|Bb7|F7|Cm7 F7'),
  bl2   : P('bl2','Blues in F · T. 5–8',    'Bb7|Bb7|F7|D7b9'),
  bl3   : P('bl3','Blues in F · T. 9–12',   'Gm7|C7|F7 D7b9|Gm7 C7'),

  /* Tonartzentren */
  k_thirds: P('k_thirds','Terzzirkel',      'Fmaj7 A7|Dbmaj7 E7|Amaj7 C7|Fmaj7'),
  k_thirds2: P('k_thirds2','Terzzirkel II', 'Dmaj7 F7|Abmaj7 B7|Ebmaj7 G7|Dmaj7'),
  k_far   : P('k_far','Entfernte Dur-Zentren','Dbmaj7|Gmaj7|Bmaj7|Fmaj7'),
  k_min   : P('k_min','Moll-Zirkel',        'Cm7|F#m7|Am7|Ebm7'),
  k_dom   : P('k_dom','Dominant-♭9-Zirkel', 'G7b9|C#7b9|E7b9|Bb7b9'),
  k_hd    : P('k_hd','Halbverminderte',     'Cm7b5|F#m7b5|Am7b5|D#m7b5'),

/* =========================================================
   5 · ÜBUNGEN ERZEUGEN (deterministisch, stabile IDs)
   ========================================================= */
function hash(str){
  let h = 2166136261;
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rng(seed){
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const CAP = 14;
function buildExercises(){
  const all = [];
  for (const L of LEVELS){
    const list = [];
    const invs = L.inversions || [0];
    if (L.pairs){
      // Bergonzis Assignment VII gibt keine freie Kombination vor, sondern
      // drei feste Form-Umkehrungs-Paare. Die werden hier wörtlich übernommen,
      // für jede Tonart.
      for (const pgId of L.progs)
        for (const { perm, inv } of L.pairs)
          list.push({
            id: `L${L.n}·${pgId}·${L.groupings[0]}·${perm}·${inv}`,
            level: L.n, prog: pgId, grouping: L.groupings[0], perm, inv
          });
    } else if (L.rotate && L.allPerms){
      // Die Gruppe (oder Umkehrung) rotiert reihum durch die Tonarten,
      // aber jede Tonart bekommt dazu alle empfohlenen Formen, nicht nur eine.
      L.progs.forEach((pgId, i) => {
        const g   = L.groupings[i % L.groupings.length];
        const inv = invs[i % invs.length];
        L.perms.forEach(pk => list.push({
          id: `L${L.n}·${pgId}·${g}·${pk}·${inv}`,
          level: L.n, prog: pgId, grouping: g, perm: pk, inv
        }));
      });
    } else if (L.rotate){
      // Jede Tonart bekommt reihum eine Kombination aus Form, Gruppe und
      // Umkehrung zugeteilt – so ist am Ende jede der 24 Kadenzen einmal
      // dran, und über die Stufe hinweg kommen alle Techniken vor.
      L.progs.forEach((pgId, i) => {
        const pk  = L.perms[i % L.perms.length];
        const g   = L.groupings[i % L.groupings.length];
        const inv = invs[i % invs.length];
        list.push({
          id: `L${L.n}·${pgId}·${g}·${pk}·${inv}`,
          level: L.n, prog: pgId, grouping: g, perm: pk, inv
        });
      });
    } else {
      for (const pgId of L.progs)
        for (const g of L.groupings)
          for (const pk of L.perms)
            for (const inv of invs)
              list.push({
                id: `L${L.n}·${pgId}·${g}·${pk}·${inv}`,
                level: L.n, prog: pgId, grouping: g, perm: pk, inv
              });
    }
    // gleichmäßig ausdünnen statt hart abschneiden
    const cap = L.cap || CAP;
    let picked = list;
    if (list.length > cap){
      picked = [];
      const step = list.length / cap;
      for (let i = 0; i < cap; i++) picked.push(list[Math.floor(i * step)]);
    }
    all.push(...picked);
  }
  return all;
}
const EXERCISES = buildExercises();
const byLevel = n => EXERCISES.filter(e => e.level === n);

/* Für eine Übung: pro Akkord Gruppe + Permutation festlegen */
function planExercise(ex){
  const prog = PROGS[ex.prog];
  const L = LEVELS[ex.level - 1];
  const r = rng(hash(ex.id));
  const groupPool = ex.grouping === 'mixed' ? ['1-5','5-9','9-13','3-7','7-11'] : [ex.grouping];
  const plan = [];
  prog.bars.forEach((bar, bi) => {
    const row = [];
    bar.forEach((ch, ci) => {
      const gId = groupPool.length === 1 ? groupPool[0] : groupPool[Math.floor(r() * groupPool.length) % groupPool.length];
      const pIdx = ex.perm === 'mixed' ? PERMS[Math.floor(r() * 24) % 24] : permByKey(ex.perm);
      const tokens = GROUPINGS[gId].tok[ch.q];
      row.push({ ch, gId, pIdx, tokens, order: pIdx.map(i => tokens[i]) });
    });
    plan.push(row);
  });
  return { ex, L, prog, plan };
}

/* Die Schreibweise wird für die ganze Progression gemeinsam gewählt, nicht pro
   Akkord: sonst würde aus der II. Stufe von as-Moll ein Aisø statt eines Bø.
   Gewertet werden die Vorzeichen aller Akkordskalen und aller gespielten Töne;
   Doppelvorzeichen wiegen schwer. Bei Gleichstand bleibt es beim Original. */
function chooseSpelling(planned, inst){
  const [dl0, ds] = TRANSPOSE[inst];
  let bestDl = dl0, bestScore = Infinity;
  for (const dl of [dl0, dl0 - 1, dl0 + 1]){
    let score = (dl === dl0 ? 0 : 1);
    for (const bar of planned.plan){
      for (const cell of bar){
        const r = transposeBy({...cell.ch.root, o:4}, dl, ds);
        if (Math.abs(r.a) > 2) { score = Infinity; break; }
        const notes = chordScale(r, cell.ch.q)
          .concat(cell.tokens.map(t => resolveToken(t, r, cell.ch.q)));
        for (const n of notes) score += Math.abs(n.a) + (Math.abs(n.a) > 1 ? 40 : 0);
      }
      if (score === Infinity) break;
    }
    if (score < bestScore){ bestScore = score; bestDl = dl; }
  }
  return bestDl;
}

/* Manche Akkord-Grundtöne führen bei bestimmten Gruppen zu Doppelvorzeichen
   (z.B. #11 auf C♯7♭9 wäre F♯♯), unabhängig davon, wie das übrige Stück
   geschrieben ist. In diesem Fall wird nur dieser eine Akkord respellt –
   in echten Chord Charts ist das üblich, ein einzelner Akkord darf anders
   geschrieben sein als seine Nachbarn. */
function chordTones(r, q, tokens){
  return chordScale(r, q).concat(tokens.map(t => resolveToken(t, r, q)));
}
function fixRoot(root, q, tokens){
  const worst = notes => Math.max(...notes.map(n => Math.abs(n.a)));
  if (worst(chordTones(root, q, tokens)) <= 1) return root;
  let best = root, bestScore = Infinity;
  for (const dl of [-1, 1, -2, 2]){
    const cand = transposeBy(root, dl, 0);          // gleicher Klang, andere Schreibweise
    const notes = chordTones(cand, q, tokens);
    if (worst(notes) > 2) continue;
    const score = notes.reduce((s, n) => s + Math.abs(n.a) + (Math.abs(n.a) > 1 ? 40 : 0), 0);
    if (score < bestScore){ bestScore = score; best = cand; }
  }
  return best;
}

/* Notierte Akkordsymbole und Tonhöhen inkl. Stimmführung und Lage */
function layout(planned, inst){
  const bass = inst === 'bass';
  const lo = bass ? 40 : 55, hi = bass ? 65 : 81;
  let prev = bass ? 45 : 64;
  const [, ds] = TRANSPOSE[inst];
  const dl = chooseSpelling(planned, inst);
  const out = [];
  planned.plan.forEach(bar => {
    const row = [];
    bar.forEach(cell => {
      const root = fixRoot(transposeBy({...cell.ch.root, o:4}, dl, ds), cell.ch.q, cell.tokens);
      let set = groupPitches(cell.tokens, root, cell.ch.q);
      if (planned.ex.inv) set = invert(set, planned.ex.inv);
      // Oktavlage: möglichst nah an den vorigen Tönen, dann in den Umfang klemmen
      const mids = set.map(midi);
      const min = Math.min(...mids), max = Math.max(...mids);
      let best = 0, bestD = Infinity;
      for (let k = -3; k <= 3; k++){
        if (min + 12 * k < lo || max + 12 * k > hi) continue;
        const d = Math.abs(mids[cell.pIdx[0]] + 12 * k - prev);
        if (d < bestD){ bestD = d; best = k; }
      }
      const shifted = set.map(n => ({...n, o:n.o + best}));
      prev = midi(shifted[cell.pIdx[3]]);
      row.push({ ...cell, symbol: chordSymbol(root, cell.ch.q), pitches: cell.pIdx.map(i => shifted[i]) });
    });
    out.push(row);
  });
  return out;
}

/* Die Bibliothek wird zur Laufzeit geladen. Mehrere Quellen, weil je nach
   Umgebung nicht jedes CDN erreichbar ist. */
const VEX_SOURCES = [
  'https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js',
  'https://unpkg.com/vexflow@4.2.2/build/cjs/vexflow.js',
  'https://cdnjs.cloudflare.com/ajax/libs/vexflow/4.2.2/vexflow.js'
];
let vexPromise = null;
function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = () => res(); s.onerror = () => rej(new Error(src));
    document.head.appendChild(s);
  });
}
async function loadVex(){
  if (typeof window.Vex !== 'undefined') return true;
  for (const src of VEX_SOURCES){
    try {
      await loadScript(src);
      if (typeof window.Vex !== 'undefined') return true;
    } catch (e) { console.warn('Notensatz-Quelle nicht erreichbar:', src); }
  }
  return false;
}
function paperMessage(host, text, withRetry){
  host.classList.add('empty');
  host.innerHTML = '';
  const p = document.createElement('div');
  p.textContent = text;
  host.append(p);
  if (withRetry){
    const b = document.createElement('button');
    b.className = 'ghost';
    b.style.cssText = 'margin-top:10px;border:1px solid #cfc7b6;color:#3c372e';
    b.textContent = 'Erneut versuchen';
    b.addEventListener('click', () => { vexPromise = null; show(); });
    host.append(b);
  }
}

let renderToken = 0;
async function renderNotation(rows, inst, host){
  const token = ++renderToken;
  paperMessage(host, 'Notensatz wird geladen …', false);

  if (!vexPromise) vexPromise = loadVex();
  const ok = await vexPromise;
  if (token !== renderToken) return;            // inzwischen kam eine neue Übung
  if (!ok){
    paperMessage(host, 'Der Notensatz lässt sich gerade nicht laden. Die Zahlenansicht funktioniert auch ohne Netz.', true);
    return;
  }

  host.classList.remove('empty');
  host.innerHTML = '';
  const VF = Vex.Flow;
  const clef = inst === 'bass' ? 'bass' : 'treble';

  const total = rows.length;
  const avail = Math.max(host.clientWidth - 12, 300);

  /* Platzbedarf pro Takt: acht Achtel brauchen doppelt so viel Raum wie vier.
     Der erste Takt bekommt Zuschlag für Schlüssel und Taktangabe. */
  const demandOf = (bar, first) =>
    30 * (bar.length * 4 + (bar.length === 1 ? 1 : 0)) + 44 + (first ? 64 : 0);
  const systemDemands = n => {
    const out = [];
    for (let s = 0; s * n < total; s++){
      out.push(rows.slice(s * n, (s + 1) * n)
                   .reduce((d, b, i) => d + demandOf(b, s === 0 && i === 0), 16));
    }
    return out;
  };
  // so viele Takte pro Zeile wie lesbar hineinpassen, sonst umbrechen
  let perSystem = Math.min(total, 4);
  while (perSystem > 1 && Math.max(...systemDemands(perSystem)) > avail) perSystem--;

  const systems = Math.ceil(total / perSystem);
  const W = Math.max(Math.min(Math.max(...systemDemands(perSystem)), Math.max(avail, 300)), 300);
  const H = systems * 118 + 20;

  const renderer = new VF.Renderer(host, VF.Renderer.Backends.SVG);
  renderer.resize(W, H);
  const ctx = renderer.getContext();
  ctx.setFont('IBM Plex Sans', 12);

  for (let s = 0; s < systems; s++){
    const barsHere = rows.slice(s * perSystem, (s + 1) * perSystem);
    const dem = barsHere.map((b, i) => demandOf(b, s === 0 && i === 0));
    const scale = (W - 16) / dem.reduce((a, b) => a + b, 0);
    let x = 8;
    barsHere.forEach((bar, i) => {
      const first = (s === 0 && i === 0);
      const staveW = dem[i] * scale;
      const y = 44 + s * 118;
      const stave = new VF.Stave(x, y, staveW);
      x += staveW;
      if (first) stave.addClef(clef).addTimeSignature('4/4');
      stave.setContext(ctx).draw();

      const notes = [], beams = [];
      bar.forEach(cell => {
        const grp = cell.pitches.map(p => {
          const n = new VF.StaveNote({ clef, keys:[vexKey(p)], duration:'8' });
          return n;
        });
        const ann = new VF.Annotation(cell.symbol)
          .setFont('Space Grotesk, sans-serif', 13, 'bold')
          .setVerticalJustification(VF.Annotation.VerticalJustify.TOP);
        grp[0].addModifier(ann, 0);
        notes.push(...grp);
        beams.push(grp);
      });
      if (bar.length === 1) notes.push(new VF.StaveNote({ clef, keys:[clef === 'bass' ? 'd/3' : 'b/4'], duration:'2r' }));

      // Balken müssen vor dem Zeichnen existieren – sonst bekommt jede Achtel eine Fahne.
      const beamObjs = beams.map(g => new VF.Beam(g));

      const voice = new VF.Voice({ num_beats:4, beat_value:4 }).setStrict(false).addTickables(notes);
      VF.Accidental.applyAccidentals([voice], 'C');
      new VF.Formatter().joinVoices([voice]).format([voice], staveW - (first ? 74 : 26));
      voice.draw(ctx, stave);
      beamObjs.forEach(b => b.setContext(ctx).draw());
    });
  }
  const svg = host.querySelector('svg');
  if (svg){
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.removeAttribute('width'); svg.removeAttribute('height');
    svg.style.width = W + 'px';
    svg.style.maxWidth = '100%';
    svg.style.height = 'auto';
  }
}

function renderNumbers(rows, inst, host){
  host.innerHTML = '';
  rows.forEach(bar => {
    const box = document.createElement('div');
    box.className = 'barbox';
    bar.forEach(cell => {
      const beat = document.createElement('div');
      beat.className = 'beat';
      const cs = document.createElement('div');
      cs.className = 'cs';
      cs.textContent = cell.symbol;
      const tk = document.createElement('div');
      tk.className = 'tok';
      tk.textContent = cell.order.join('·');
      beat.append(cs, tk);
      box.append(beat);
    });
    host.append(box);
  });
}

/* =========================================================
   7 · FORTSCHRITT & AUSWAHL
   ========================================================= */
const KEY = 'bergonzi-v1';
let state = { settings:{ inst:'Bb', view:'notes' }, level:1, counter:0, prog:{}, lastId:null };
let current = null;

/* Speicher: nutzt window.storage, wo es das gibt, sonst den Browser-Speicher.
   So läuft dieselbe Datei innerhalb von Claude und als statische Seite. */
const store = (typeof window.storage !== 'undefined' && window.storage) ? {
  async get(){ const r = await window.storage.get(KEY); return r ? r.value : null; },
  async set(v){ await window.storage.set(KEY, v); }
} : {
  async get(){ return localStorage.getItem(KEY); },
  async set(v){ localStorage.setItem(KEY, v); }
};
async function load(){
  try {
    const v = await store.get();
    if (v) state = Object.assign(state, JSON.parse(v));
  } catch (e) { /* erster Start: nichts gespeichert */ }
}
async function save(){
  try { await store.set(JSON.stringify(state)); }
  catch (e) { console.warn('Fortschritt nicht gespeichert', e); }
}
const rec = id => state.prog[id] || { s:'n', due:-1, reps:0 };
const isMastered = id => rec(id).s === 'm';

function levelDone(n){ const p = byLevel(n); return p.length > 0 && p.every(e => isMastered(e.id)); }
function levelCount(n){ const p = byLevel(n); return [p.filter(e => isMastered(e.id)).length, p.length]; }
function pick(){
  const pool = byLevel(state.level);
  const open = pool.filter(e => !isMastered(e.id));
  let cands = open.length ? open : pool;          // alles gemeistert → Wiederholungsrunde
  const due = cands.filter(e => rec(e.id).due <= state.counter);
  let list = due.length ? due : cands;
  if (list.length > 1 && state.lastId) {
    const f = list.filter(e => e.id !== state.lastId);
    if (f.length) list = f;
  }
  list = list.slice().sort((a,b) => (rec(a.id).due - rec(b.id).due) || (hash(a.id) - hash(b.id)));
  return list[0];
}

async function answer(mastered){
  if (!current) return;
  const id = current.ex.id, r = rec(id);
  state.prog[id] = { s: mastered ? 'm' : 'r', due: state.counter + (mastered ? 40 : 3), reps: r.reps + 1 };
  state.lastId = id;
  state.counter++;

  if (levelDone(state.level) && state.level < LEVELS.length){
    state.level++;
    toast('Stufe ' + state.level + ' freigeschaltet: ' + LEVELS[state.level - 1].title);
  }
  await save();
  show();
}

/* =========================================================
   8 · OBERFLÄCHE
   ========================================================= */
const $ = s => document.querySelector(s);
let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

function drawSpine(){
  const svg = $('#spine');
  const N = LEVELS.length, x0 = 44, dx = (760 - 2 * x0) / (N - 1);
  const yTop = 30, yBot = 62, dy = (yBot - yTop) / (N - 1);
  let s = '';
  for (let i = 0; i < 5; i++)
    s += `<line x1="12" y1="${30 + i * 8}" x2="748" y2="${30 + i * 8}" stroke="#273346" stroke-width="1"/>`;
  LEVELS.forEach((L, i) => {
    const x = x0 + i * dx, y = yBot - i * dy;
    const [d, t] = levelCount(L.n);
    const done = d === t, started = d > 0;
    const fill = done ? '#57C7B0' : started ? '#E3A83E' : '#2C384C';
    const cur = L.n === state.level;
    if (cur) s += `<circle cx="${x}" cy="${y}" r="12" fill="none" stroke="#E3A83E" stroke-width="1.5" opacity=".85"/>`;
    s += `<ellipse cx="${x}" cy="${y}" rx="6.6" ry="5" fill="${fill}" transform="rotate(-20 ${x} ${y})"/>`;
    s += `<text x="${x}" y="86" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11"
            fill="${cur ? '#E3A83E' : '#5D6C81'}">${L.n}</text>`;
    s += `<rect class="lvl-hit" data-lvl="${L.n}" x="${x - 15}" y="14" width="30" height="78" fill="transparent"><title>Stufe ${L.n}: ${L.title} (${d}/${t})</title></rect>`;
  });
  svg.innerHTML = s;
  svg.querySelectorAll('.lvl-hit').forEach(r => r.addEventListener('click', () => {
    state.level = +r.dataset.lvl; state.lastId = null; save(); show();
  }));
}

function chip(text, cls){ return `<span class="chip${cls ? ' ' + cls : ''}">${text}</span>`; }

function show(){
  const ex = pick();
  if (!ex) return;
  current = planExercise(ex);
  const { L, prog } = current;
  const inst = state.settings.inst;
  const rows = layout(current, inst);

  $('#eyebrow').textContent = 'Stufe ' + L.n + ' · ' + L.head;
  $('#title').textContent = L.title;
  $('#lvl-name').textContent = '— aktuell: ' + L.title;

  // Chips
  const c = [];
  c.push(chip(prog.single ? rows[0][0].symbol + ' · ein Takt' : prog.name, 'key'));
  if (ex.grouping === 'mixed') c.push(chip('Gruppen gemischt'));
  else c.push(chip('Gruppe ' + GROUPINGS[ex.grouping].label + ' · ' + GROUPINGS[ex.grouping].name));
  if (ex.perm === 'mixed') c.push(chip('Formen gemischt'));
  else if (ex.grouping !== 'mixed'){
    const g = GROUPINGS[ex.grouping], p = permByKey(ex.perm);
    c.push(chip(permLabel(p, g.tok['maj7']) + '  |  ' + permLabel(p, g.tok['m7']) + ' (Moll)'));
  }
  if (ex.inv) c.push(chip(ex.inv + '. Umkehrung'));
  if (L.edit) c.push(chip('Editing'));
  if (L.visual) c.push(chip('ohne Instrument'));
  $('#chips').innerHTML = c.join('');

  // Anweisung
  const r = rec(ex.id);
  const again = r.s === 'r' ? '<div class="sub">Diese Übung hattest du schon – jetzt im Tempo, in dem du sie auch spielen willst.</div>' : '';
  $('#instruction').innerHTML = `<b>${L.text}</b>${again}`;
  const ref = BOOK_REFS[L.n] || '';
  $('#bookref').textContent = ref;
  $('#bookref').hidden = !ref;

  // Darstellung
  const notesOn = state.settings.view === 'notes';
  $('#paper').hidden = !notesOn;
  $('#numbers').hidden = notesOn;
  if (notesOn) renderNotation(rows, inst, $('#paper'));
  else renderNumbers(rows, inst, $('#numbers'));

  const [d, t] = levelCount(L.n);
  const totalM = EXERCISES.filter(e => isMastered(e.id)).length;
  $('#stats').textContent = `Stufe ${L.n}: ${d}/${t} sitzen · insgesamt ${totalM}/${EXERCISES.length} · ${state.counter} Durchgänge`;

  drawSpine();
}

/* Steuerung */
$('#btn-got').addEventListener('click', () => answer(true));
$('#btn-again').addEventListener('click', () => answer(false));
$('#sel-inst').addEventListener('change', e => { state.settings.inst = e.target.value; save(); show(); });
function setView(v){
  state.settings.view = v;
  $('#v-notes').setAttribute('aria-pressed', v === 'notes');
  $('#v-nums').setAttribute('aria-pressed', v === 'nums');
  save(); show();
}
$('#v-notes').addEventListener('click', () => setView('notes'));
$('#v-nums').addEventListener('click', () => setView('nums'));
$('#btn-level-done').addEventListener('click', async () => {
  const n = state.level, L = LEVELS[n - 1];
  if (!confirm(`Alle Übungen der Stufe ${n} ("${L.title}") als "sitzt" markieren? Nützlich, wenn gespeicherter Fortschritt verloren ging.`)) return;
  byLevel(n).forEach(e => {
    const r = rec(e.id);
    state.prog[e.id] = { s:'m', due: state.counter + 200, reps: r.reps + 1 };
  });
  state.lastId = null;
  if (n < LEVELS.length){ state.level = n + 1; toast('Stufe ' + state.level + ' freigeschaltet: ' + LEVELS[state.level - 1].title); }
  else toast('Stufe ' + n + ' markiert');
  await save(); show();
});
$('#btn-reset').addEventListener('click', async () => {
  if (!confirm('Gesamten Fortschritt löschen?')) return;
  state.prog = {}; state.counter = 0; state.level = 1; state.lastId = null;
  await save(); show(); toast('Fortschritt zurückgesetzt');
});
let rt;
window.addEventListener('resize', () => {
  if (state.settings.view !== 'notes' || !current) return;
  clearTimeout(rt);
  rt = setTimeout(() => renderNotation(layout(current, state.settings.inst), state.settings.inst, $('#paper')), 180);
});

(async function init(){
  await load();
  state.level = Math.min(state.level || 1, LEVELS.length);
  $('#sel-inst').value = state.settings.inst;
  $('#v-notes').setAttribute('aria-pressed', state.settings.view === 'notes');
  $('#v-nums').setAttribute('aria-pressed', state.settings.view === 'nums');
  show();
})();
</script>
